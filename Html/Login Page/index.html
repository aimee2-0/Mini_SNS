<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Code InTo Guys</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- add Bootstrap cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- add new Font  -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="-bs-danger-bg-subtley">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row shadow rounded overflow-hidden w-100" style="max-width: 1000px;">

            <!-- LEFT SIDE -->
            <div class="col-md-6 d-none d-md-flex bg-primary text-white align-items-center justify-content-center p-4">
                <div class="text-center">
                    <img src="img/logo.png" alt="My Logo" class="img-fluid mb-3" style="max-height: 300px;">
                    <h2 class="fw-bold">Guys InTo Code  </h2>
                    <p class="mt-2">
                        TTC developers sharing knowledge and solving problems.
                    </p>

                    <ul class="list-unstyled text-start mt-4">
                        <li class="mb-2"><i class="fa fa-check-circle me-2"></i> Get coding answers</li>
                        <li class="mb-2"><i class="fa fa-check-circle me-2"></i> Share knowledge</li>
                        <li class="mb-2"><i class="fa fa-check-circle me-2"></i> Build your profile</li>
                        <li><i class="fa fa-check-circle me-2"></i> Win the World</li>
                    </ul>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="col-md-6 bg-white p-4 p-md-5">
                <h3 class="fw-bold mb-1">Log In</h3>
                <p class="text-muted mb-4">Welcome back! Please log in.</p>

                <form method="POST" action="login.jsp">

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">User Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="User Name" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>


                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            
                        </div>
                        
                    </div>

                    <!-- Login Button -->
                    <button class="btn btn-primary w-100 mb-3">
                        <i class="fa fa-sign-in-alt me-2"></i> Log In
                    </button>

                    <!-- Divider -->
                    <div class="text-center text-muted mb-3">— or —</div>

                    
                    <!-- Signup -->
                    <p class="text-center">
                        Don’t have an account?
                        <a href="../register Page/register.html">Sign up</a>
                    </p>

                </form>

                <!-- Footer -->
                <div class="text-center text-muted mt-4 small">
                   
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
