<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ask Question - Code InTo Guys</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Guys InTo Code</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="nav" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Q&A</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">SNS</a></li>
                </ul>

                <a class="btn btn-primary btn-sm ms-2">Profile</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h4 class="mb-0">
                        <i class="fas fa-question-circle me-2"></i>Ask a Question
                    </h4>
                    <small class="text-muted">Share your coding question with the community</small>
                </div>
                <div class="card-body p-4">
                    <form id="askQuestionForm">
                        <!-- Question Title -->
                        <div class="mb-4">
                            <label for="questionTitle" class="form-label">
                                <i class="fas fa-heading me-2"></i>Question Title
                            </label>
                            <input type="text" class="form-control form-control-lg" id="questionTitle" 
                                placeholder="e.g., How to center a div using Flexbox?" required>
                            <small class="text-muted">Be specific and descriptive</small>
                        </div>

                        <!-- Question Content -->
                        <div class="mb-4">
                            <label for="questionContent" class="form-label">
                                <i class="fas fa-align-left me-2"></i>Question Details
                            </label>
                            <textarea class="form-control" id="questionContent" rows="8" 
                                placeholder="Describe your question in detail. Include any code snippets, error messages, or context that might help others understand your problem." required></textarea>
                            <small class="text-muted">Provide as much detail as possible to get better answers</small>
                        </div>
                        <!-- Image Upload -->
                        <div class="mb-4">
                            <label for="postImage" class="form-label">
                                <i class="fas fa-image me-2"></i>Add Image (Optional)
                            </label>
                            <input type="file" class="form-control" id="postImage" accept="image/*">
                            <small class="text-muted">Upload a screenshot or image related to your post</small>
                            <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                                <img id="imagePreview" class="image-preview" alt="Preview">
                                <button type="button" class="remove-image" id="removeImage">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Topic/Tag Selection -->
                        <div class="mb-4">
                            <label for="questionTopic" class="form-label">
                                <i class="fas fa-tag me-2"></i>Topic
                            </label>
                            <select class="form-select" id="questionTopic"  required>
                                <option value="">Select a topic...</option>
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="java">Java</option>
                                <option value="react">React</option>
                                <option value="css">CSS</option>
                                <option value="html">HTML</option>
                                <option value="nodejs">Node.js</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        
                        <!-- Code Snippet (Optional) -->
                        <!-- <div class="mb-4">
                            <label for="codeSnippet" class="form-label">
                                <i class="fas fa-code me-2"></i>Code Snippet (Optional)
                            </label>
                            <textarea class="form-control font-monospace" id="codeSnippet" rows="6" 
                                placeholder="Paste your code here if applicable..."></textarea>
                            <small class="text-muted">Use this to share relevant code</small>
                        </div> -->

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="../Top Page/index.html" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                            <div>
                                <button type="button" class="btn btn-outline-primary me-2" id="previewBtn">
                                    <i class="fas fa-eye me-2"></i>Preview
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane me-2"></i>Post Question
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Preview Card (Hidden by default) -->
            <div class="card shadow-sm mt-4" id="previewCard" style="display: none;">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0">Preview</h5>
                </div>
                <div class="card-body">
                    <h6 id="previewTitle"></h6>
                    <p id="previewContent" class="text-muted"></p>
                    <div id="previewTags"></div>
                    <div id="previewCode" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-light text-center py-3 mt-4">
        © 2026 Code InTo Guys
    </footer>

    <!-- JSP / Servlet placeholder: -->
    <!-- Implement tag management, question submission, and preview logic -->
    <!-- here using JSP/Tomcat instead of client-side JavaScript. -->
</body>

</html>
