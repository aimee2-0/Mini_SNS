<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="border-light-subtle">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 shadow bg-white rounded p-4" style="max-width: 900px;">

        <!-- LEFT SIDE -->
        <div class="col-md-6 d-none d-md-flex flex-column justify-content-center bg-success text-white rounded-start p-4 text-center">
            <div class="text-center">
                    <img src="img/logo.png" alt="My Logo" class="img-fluid mb-3" style="max-height: 300px;">
            </div>
            <h2 class="mb-3">
                <i class="fas fa-rocket me-2"></i> Join Our Community
            </h2>
            <p>Learn, share knowledge, and grow as a developer.</p>

            <ul class="list-unstyled mt-3">
                <li class="mb-2"><i class="fas fa-lightbulb me-2"></i> Learn & Share</li>
                <li class="mb-2"><i class="fas fa-trophy me-2"></i> Earn Recognition</li>
                <li class="mb-2"><i class="fas fa-users me-2"></i> Network</li>
                <li class="mb-2"><i class="fas fa-briefcase me-2"></i> Career Growth</li>
            </ul>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6 p-4">
            <h3 class="mb-3">Create Account</h3>

            <form method="post" action="register.jsp">
                
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>

                

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-user-plus me-2"></i> Create Account
                </button>

                <hr class="my-4">


                <p class="text-center mt-3">
                    Already have an account?
                    <a href="../Login Page/index.html">Login</a>
                </p>

            </form>
        </
